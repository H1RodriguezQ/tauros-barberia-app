<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resultados · Encuesta Tauros</title>
<meta name="theme-color" content="#0b0b12">
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/encuesta/encuesta.css">
</head>
<body>
<main class="wrap ancho" id="res">
  <header>
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#16161f" stroke="#c8962a"/><path d="M9 14c4 0 7 2 8.5 6 1.5-4.5 4-7 6.5-7s5 2.5 6.5 7c1.5-4 4.5-6 8.5-6-1 6-4.5 9-8.5 10v4c0 6-3.5 9.5-6.5 11-3-1.5-6.5-5-6.5-11v-4C13.5 23 10 20 9 14z" fill="#c8962a"/></svg>
    <b>Tauros</b><span>Resultados</span>
    <a href="/encuesta">Responder la encuesta</a>
  </header>
  <div class="res-top">
    <h1>Lo que opinan <em>del sitio.</em></h1>
    <span class="vivo" role="status"><i></i><span id="actualizado">En vivo</span></span>
  </div>
  <div class="grid">
    <section class="card"><h2>Calificación</h2><div class="big" id="r-prom">–<small> / 5</small></div><div class="estrellas-txt" id="r-est" aria-hidden="true"></div></section>
    <section class="card"><h2>Respuestas</h2><div class="big" id="r-total">0</div></section>
    <section class="card"><h2>Facilidad de uso</h2><div class="big" id="r-fac">–<small> / 5</small></div></section>
    <section class="card"><h2>Estrellas</h2><div id="r-dist"></div></section>
    <section class="card"><h2>¿Lo usarían?</h2><div id="r-usaria"></div></section>
    <section class="card"><h2>Lo que más gustó</h2><div id="r-gusto"></div></section>
    <section class="card span2" id="r-com-card"><h2>Comentarios</h2><div id="r-com"></div></section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="/js/config.js"></script>
<script src="/encuesta/resultados.js"></script>
</body>
</html>
